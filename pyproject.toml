[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "khepri"
version = "0.1.0"
description = "Lightweight SLM runtime and autonomous personal agent for ARM & low-power hardware"
authors = [{ name = "Pranabesh" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = [
    "llama-cpp-python>=0.2.80",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "types-Pillow>=10.2.0.20240822",
]

[project.scripts]
khepri = "pithon.cli:main"
pithon = "pithon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pithon*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W293", "W291"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
