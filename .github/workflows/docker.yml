name: Docker CI & Registry Publishing

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'pithon/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'Dockerfile*'
      - 'docker-compose.yml'
      - 'docker-entrypoint.sh'
      - 'pithon/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-compose:
    name: Validate Docker Compose Config
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create mock environment file
        run: |
          cat << 'ENVEOF' > .env
          TELEGRAM_BOT_TOKEN=0000000000:AA_mock_token_for_ci_testing_only
          TELEGRAM_ADMIN_CHAT_ID=123456789
          TELEGRAM_REPORT_CHAT_ID=123456789
          PORTAL_PASSPHRASE=ci_mock_passphrase_testing
          ENVEOF

      - name: Validate docker-compose.yml syntax and schema
        run: |
          docker compose config --quiet
          echo "docker-compose.yml configuration is valid"

  build-and-test:
    name: Build & Smoke Test (${{ matrix.target.name }} - ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: validate-compose
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        target:
          - name: pithon-daemon
            dockerfile: Dockerfile
            tag: pithon:test
            smoke_test: |
              docker run --rm pithon:test pithon --help
              docker run --rm pithon:test python3 -c "import pithon; import llama_cpp; print('Daemon container and C++ bindings verified successfully')"
          - name: pithon-agent
            dockerfile: Dockerfile.agent
            tag: pithon-agent:test
            smoke_test: |
              docker run --rm pithon-agent:test python3 -c "import pithon; from pithon.agent.storage import Storage; print('Agent container verified successfully')"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          load: true
          tags: ${{ matrix.target.tag }}
          cache-from: type=gha,scope=${{ matrix.target.name }}-${{ matrix.os }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}-${{ matrix.os }}

      - name: Run smoke tests
        run: |
          ${{ matrix.target.smoke_test }}

  publish-ghcr:
    name: Publish Multi-Arch Images to GHCR
    runs-on: ubuntu-24.04
    needs: [validate-compose, build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up QEMU for multi-arch emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for pithon-daemon
        id: meta-daemon
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pithon-daemon
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push pithon-daemon (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-daemon.outputs.tags }}
          labels: ${{ steps.meta-daemon.outputs.labels }}
          cache-from: type=gha,scope=daemon-multiarch
          cache-to: type=gha,mode=max,scope=daemon-multiarch

      - name: Extract metadata for pithon-agent
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pithon-agent
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push pithon-agent (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=agent-multiarch
          cache-to: type=gha,mode=max,scope=agent-multiarch
