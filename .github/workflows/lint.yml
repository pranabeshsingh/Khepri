name: Lint & Code Quality

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff Linter (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check pithon tests

      - name: Verify Python bytecode compilation
        run: python -m compileall pithon tests

  mypy:
    name: Mypy Static Type Checking
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Mypy & Dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://abetlen.github.io/llama-cpp-python/whl/cpu
        run: |
          pip install --upgrade pip
          pip install mypy types-Pillow
          pip install --prefer-binary -e .

      - name: Run Mypy
        run: mypy pithon
