name: Sync Documentation to Wiki

on:
  push:
    branches: [ master, main ]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-wiki:
    name: Sync wiki/ to GitHub Wiki Repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Clone GitHub Wiki Repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-clone || {
            echo "Wiki repository not initialized or not accessible. Ensure Wiki is enabled in repository settings."
            exit 1
          }

      - name: Copy Documentation & Commit Changes
        run: |
          cp -rf wiki/* wiki-clone/
          cd wiki-clone
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki documentation is already fully up to date."
          else
            git commit -m "docs(wiki): sync from main repository commit ${{ github.sha }} [skip ci]"
            git push origin HEAD
            echo "Successfully synchronized wiki pages to GitHub Wiki!"
          fi
