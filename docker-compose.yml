services:
  pithon:
    build:
      context: .
      dockerfile: Dockerfile
    image: pithon:latest
    container_name: pithon-daemon
    restart: unless-stopped
    ports:
      # Strictly bind to loopback port 8090 to prevent external exposure and avoid port collisions
      - "127.0.0.1:8090:8080"
    volumes:
      - ./models:/app/models
    environment:
      - PITHON_MODEL=/app/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
    # Enforce strict cgroup resource constraints
    # Cap CPU to 1 core max (out of 2 cores) so OwnTracks & host always have dedicated CPU
    cpus: 1.0
    mem_limit: 1408m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1408M"
        reservations:
          cpus: "0.2"
          memory: "512M"

  pithon-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: pithon-agent:latest
    container_name: pithon-agent
    restart: unless-stopped
    ports:
      # Binds internally to loopback port 8091 for Host Nginx reverse proxy
      - "127.0.0.1:8091:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PITHON_DAEMON_URL=http://pithon:8080
      - DB_PATH=/app/data/pithon.db
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
    depends_on:
      - pithon
